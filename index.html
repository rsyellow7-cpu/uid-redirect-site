<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YS X Cheats - UID Activation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h1 { color: #38bdf8; margin-bottom: 8px; font-size: 28px; }
    p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { padding: 12px 20px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    #statusBox { display: none; padding: 14px; border-radius: 6px; font-size: 14px; font-weight: 600; text-align: center; }
    .status-success { background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; color: #4ade80; }
    .status-error { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; }
  </style>
</head>
<body>

  <div class="card">
    <h1>YS X CHEATS</h1>
    <p class="subtitle">Enter your UID below to activate access</p>

    <div class="input-group">
      <input type="text" id="uidInput" placeholder="Enter UID (e.g. 9059)" />
      <button onclick="submitUid()">Submit</button>
    </div>

    <div id="statusBox"></div>
  </div>

  <script>
    async function submitUid() {
      const uidInput = document.getElementById('uidInput');
      const statusBox = document.getElementById('statusBox');
      const uid = uidInput.value.trim();

      if (!uid) {
        showStatus('Please enter a valid UID.', false);
        return;
      }

      showStatus('Processing UID...', null);

      try {
        const response = await fetch(`/api/add-uid/${encodeURIComponent(uid)}`);
        const result = await response.json();

        if (result.success) {
          showStatus(`✓ Success! UID ${uid} has been added.`, true);
          uidInput.value = '';
        } else {
          showStatus(`✕ ${result.message}`, false);
        }
      } catch (err) {
        showStatus('✕ System error. Failed to reach server.', false);
      }
    }

    function showStatus(text, isSuccess) {
      const statusBox = document.getElementById('statusBox');
      statusBox.style.display = 'block';
      statusBox.innerText = text;

      if (isSuccess === true) {
        statusBox.className = 'status-success';
      } else if (isSuccess === false) {
        statusBox.className = 'status-error';
      } else {
        statusBox.className = '';
        statusBox.style.background = '#334155';
        statusBox.style.color = '#cbd5e1';
      }
    }
  </script>
</body>
</html>
