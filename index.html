<!-- Input form on your website -->
<input type="text" id="uidInput" placeholder="Enter your UID" />
<button onclick="submitUid()">Submit</button>

<!-- Container to show result on your page -->
<div id="resultContainer"></div>

<script>
async function submitUid() {
  const uid = document.getElementById('uidInput').value;
  const resultContainer = document.getElementById('resultContainer');

  if (!uid) {
    alert('Please enter a UID');
    return;
  }

  resultContainer.innerText = 'Loading...';

  try {
    // Call your own Render backend API endpoint
    const response = await fetch(`/api/get-data/${uid}`);
    const data = await response.text();

    // Display the result on your website
    resultContainer.innerText = data;
  } catch (err) {
    resultContainer.innerText = 'Error loading data.';
  }
}
</script>
