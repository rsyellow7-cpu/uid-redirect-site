<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UID Submission Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
        }
        h2 {
            margin-top: 0;
            color: #333333;
        }
        label {
            font-size: 14px;
            color: #666666;
            display: block;
            margin-bottom: 6px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Enter User ID</h2>
        <form id="uidForm">
            <label for="uidInput">User ID (UID):</label>
            <input 
                type="text" 
                id="uidInput" 
                placeholder="Enter UID (e.g. user_123)" 
                required 
                autocomplete="off"
            >
            <button type="submit">Submit & Continue</button>
        </form>
    </div>

    <!-- JavaScript Link -->
    <script src="script.js"></script>
</body>
</html>
